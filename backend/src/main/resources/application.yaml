spring:
  application:
    name: school-management-backend

  config:
    import: "optional:file:../.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/school_management}
    username: ${DB_USERNAME:school_app}
    password: ${DB_PASSWORD:school_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:0}
      idle-timeout: 60000
      max-lifetime: 240000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: school-management-system
    access-token-minutes: 15

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    # Never publish this value in the frontend or repository.
    admin-password: ${DEMO_ADMIN_PASSWORD:}
