name: Isolated full-stack E2E

on:
  push:
    branches:
      - test/production-smoke-2026-11-16
      - feature/role-portals-profile-and-tracker
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: school-management-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-stack-e2e:
    name: Database, API and browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: school_management
          POSTGRES_USER: school_app
          POSTGRES_PASSWORD: school_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U school_app -d school_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests clean package

      - name: Start backend against isolated PostgreSQL
        working-directory: backend
        run: |
          SECRET="$(openssl rand -base64 32)"
          nohup env \
            DB_URL="jdbc:postgresql://localhost:5433/school_management" \
            DB_USERNAME="school_app" \
            DB_PASSWORD="school_dev_password" \
            JWT_SECRET="$SECRET" \
            CORS_ALLOWED_ORIGINS="http://localhost:5173" \
            java -Xms128m -Xmx512m -jar target/backend-0.0.1-SNAPSHOT.jar \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend production bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: |
          nohup npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://localhost:5173/ > /dev/null; then
              echo "Frontend is serving"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/frontend.log"
          exit 1

      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-package-lock --no-save playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Test attendance lifecycle
        env:
          API_BASE_URL: http://localhost:8080
        run: node .github/scripts/e2e-attendance.mjs

      - name: Test examination and report-card lifecycle
        env:
          API_BASE_URL: http://localhost:8080
        run: node .github/scripts/e2e-exams.mjs

      - name: Test invoice and simulated-payment lifecycle
        env:
          API_BASE_URL: http://localhost:8080
        run: node .github/scripts/e2e-fees.mjs

      - name: Test student, guardian and teacher self-service APIs
        env:
          API_BASE_URL: http://localhost:8080
        run: node .github/scripts/e2e-self-service.mjs

      - name: Test role account provisioning
        env:
          API_BASE_URL: http://localhost:8080
        run: node .github/scripts/e2e-provisioning.mjs

      - name: Test browser UI for all four roles
        env:
          FRONTEND_URL: http://localhost:5173
          RUNNER_TEMP: ${{ runner.temp }}
        run: node .github/scripts/e2e-ui.cjs

      - name: Upload backend log if job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-e2e-backend-log
          path: ${{ runner.temp }}/backend.log
          if-no-files-found: ignore
